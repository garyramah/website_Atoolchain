<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atoolchain</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --card: #1f2937;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-strong: #0ea5e9;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #020817 0%, var(--bg) 100%);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      .container {
        width: min(900px, 90vw);
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 20px;
        padding: 48px 32px;
        box-shadow: 0 20px 60px rgba(14, 165, 233, 0.12);
      }

      .eyebrow {
        color: var(--accent);
        font-size: 0.78rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin-bottom: 16px;
        font-weight: 700;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.4rem, 4vw, 4rem);
        line-height: 1.1;
      }

      p {
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.7;
        max-width: 60ch;
      }

      .cta-row {
        margin-top: 24px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .btn {
        display: inline-block;
        text-decoration: none;
        padding: 12px 20px;
        border-radius: 999px;
        font-weight: 700;
        transition: transform 0.2s ease, opacity 0.2s ease;
      }

      .btn:hover {
        transform: translateY(-1px);
      }

      .btn-primary {
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        color: #082f49;
      }

      .btn-secondary {
        color: var(--text);
        border: 1px solid rgba(148, 163, 184, 0.4);
        background: rgba(15, 23, 42, 0.4);
      }
    </style>
  </head>
  <body>
    <main class="container">
      <div class="eyebrow">website_Atoolchain</div>
      <h1>Atoolchain</h1>
      <p>
        A simple landing page for a modern toolchain product. Built to be lightweight,
        clean, and easy to expand with more sections later.
      </p>
      <div class="cta-row">
        <a class="btn btn-primary" href="#">Get Started</a>
        <a class="btn btn-secondary" href="#">Learn More</a>
      </div>
    </main>
  </body>
</html>
